name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check module metadata
        run: go mod tidy -diff
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test without cgo
        run: CGO_ENABLED=0 go test ./...
      - name: Test purego without cgo
        run: CGO_ENABLED=0 go test -tags=purego ./...
      - name: Test races
        run: go test -race ./...
      - name: Bounded fuzz smoke tests
        env:
          GOMAXPROCS: "2"
        run: |
          go test ./internal/decode -run '^$' -fuzz '^FuzzProtobufEntrypoints$' -fuzztime=3s -parallel=2
          go test ./internal/decode -run '^$' -fuzz '^FuzzTensorDecode$' -fuzztime=3s -parallel=2
          go test ./internal/graph -run '^$' -fuzz '^FuzzGraphReferences$' -fuzztime=3s -parallel=2
          go test . -run '^$' -fuzz '^FuzzShapeAttributePlanning$' -fuzztime=3s -parallel=2
